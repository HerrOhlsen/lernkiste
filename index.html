<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">

<meta name="description" content="Lern-App mit Kisten, Stickern und kurzen Lektionen. Mathe Klasse 5 und Englisch-Vokabeln.">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<body>
<main id="app"></main>
<nav id="nav">
  <button type="button" data-s="pfad" class="on"><span>🗺️</span>Mathe</button>
  <button type="button" data-s="vokabeln"><span>📚</span>Englisch</button>
  <button type="button" data-s="sammlung"><span>🎒</span>Sammlung</button>
  <button type="button" data-s="ich"><span>⭐</span>Ich</button>
</nav>
<script>
window.addEventListener("error", function (e) {
  var box = document.createElement("div");
  box.style.cssText = "position:fixed;left:8px;right:8px;bottom:90px;z-index:99;background:#3d1520;color:#fff;padding:12px;border-radius:12px;font:14px system-ui";
  box.textContent = "Fehler: " + (e.message || e.error) + " (" + (e.filename || "").split("/").pop() + ":" + e.lineno + ") " + navigator.userAgent.slice(0, 120);
  document.body.appendChild(box);
});
</script>
<script src="js/util.js"></script>
<script src="content/mathe/multiplizieren.js"></script>
<script src="js/engine.js"></script>
<script src="js/vokabeln.js"></script>
<script src="js/sync.js"></script>
<script src="js/app.js"></script>
</body>
